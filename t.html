<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Opening your link…</title>
<style>body{font-family:Arial,Helvetica,sans-serif;margin:40px;color:#222}</style>
</head>
<body>
<p>Opening your link…</p>
<script>
(function () {
  // Set to the Email Tracking Apps Script /exec URL after deployment.
  var SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbynZLVMiZCd8LCT_co_sKyua8AdXYJQpzv_ZgnT496m_iXwLB0ehZMoiQ3HpYfvSXrB0A/exec';
  var q = new URLSearchParams(location.search);
  var t = q.get('t') || '';
  var i = q.get('i') || '';
  var u = q.get('u') || '';
  var okId = /^[A-HJ-NP-Z2-9]{10}$/.test(t);
  var okLink = /^\d+$/.test(i);
  // Only ever redirect to http/https — never let this page bounce people elsewhere.
  var okDest = /^https?:\/\//i.test(u);
  if (okId && okLink) {
    var url = SCRIPT_URL + '?kind=click&t=' + encodeURIComponent(t) + '&i=' + encodeURIComponent(i);
    if (navigator.sendBeacon) { navigator.sendBeacon(url); }
    else { fetch(url, { mode: 'no-cors', keepalive: true }).catch(function () {}); }
  }
  if (okDest) { location.replace(u); }
  else { document.body.innerHTML = '<p>Sorry, this link is not valid.</p>'; }
})();
</script>
</body>
</html>
